<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="lobe-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4f7fb" />
      <stop offset="35%" stop-color="#b8c9dc" stop-opacity="0.75" />
      <stop offset="72%" stop-color="#5a7390" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#1a2430" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lobe-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8eb0d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8eb0d4" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.65" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#000" rx="12" />
  <g filter="url(#soft)">
    <ellipse cx="21" cy="21" rx="15" ry="15" fill="url(#lobe-halo)" />
    <ellipse cx="43" cy="21" rx="15" ry="15" fill="url(#lobe-halo)" />
    <ellipse cx="21" cy="43" rx="15" ry="15" fill="url(#lobe-halo)" />
    <ellipse cx="43" cy="43" rx="15" ry="15" fill="url(#lobe-halo)" />
    <ellipse cx="21" cy="21" rx="11.5" ry="11.5" fill="url(#lobe-core)" />
    <ellipse cx="43" cy="21" rx="11.5" ry="11.5" fill="url(#lobe-core)" />
    <ellipse cx="21" cy="43" rx="11.5" ry="11.5" fill="url(#lobe-core)" />
    <ellipse cx="43" cy="43" rx="11.5" ry="11.5" fill="url(#lobe-core)" />
  </g>
  <circle cx="32" cy="32" r="2.2" fill="#f8fbff" />
  <circle cx="32" cy="32" r="4.5" fill="#9eb8d8" fill-opacity="0.22" />
</svg>
